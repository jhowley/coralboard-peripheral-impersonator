name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Public-tree guard
        run: make check

      - name: Offline test suite (no hardware, no SDK, no network)
        run: make test
